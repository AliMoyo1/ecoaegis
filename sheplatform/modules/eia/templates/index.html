{% extends "base_shell.html" %}
{% block title %}Environmental Impact Assessment - EcoAegis{% endblock %}
{% block content %}
<h1>Environmental Impact Assessment (SHEIA)</h1>

<div class="card">
  <h2>Register project</h2>
  <form id="eia-form">
    <label>Project name <input type="text" name="project_name" required></label>
    <label>Department <input type="text" name="department"></label>
    <label>Type <input type="text" name="project_type"></label>
    <label>Location <input type="text" name="location"></label>
    <button class="btn btn-primary" type="submit">Register project</button>
  </form>
</div>

<div class="card">
  <h2>Project list</h2>
  <table class="data-table" id="eia-table">
    <thead><tr><th>Ref</th><th>Project</th><th>Status</th><th>EIA req</th><th>Blocked</th><th>EMA decision</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script src="/static/js/eia.js"></script>
{% endblock %}
