{% extends "base_shell.html" %}
{% block title %}Emergency - EcoAegis{% endblock %}
{% block content %}
<h1>Emergency Preparedness & Response (SHEEPRP + SHEER)</h1>

<div class="card">
  <h2>Log emergency event</h2>
  <form id="emergency-form">
    <label>Title <input type="text" name="title" required></label>
    <label>Description <textarea name="description" rows="2"></textarea></label>
    <label>Severity
      <select name="severity">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high" selected>High</option>
        <option value="critical">Critical</option>
      </select>
    </label>
    <label>Canonical site
      <select name="site_id" aria-describedby="emergency-site-help">
        <option value="">Not linked / site not yet identified</option>
        {% for site in sites %}
        <option value="{{ site.id }}">{{ site.site_code }} — {{ site.site_name }}{% if site.city %} ({{ site.city }}){% endif %}</option>
        {% endfor %}
      </select>
      <small id="emergency-site-help" style="display:block;color:var(--muted);margin-top:4px">Only active sites in your organisation are shown. This link supplies the map location.</small>
    </label>
    <label>Location details (optional)
      <input type="text" name="site_location" placeholder="e.g. generator room, east entrance">
      <small style="display:block;color:var(--muted);margin-top:4px">Description only; it does not set map coordinates.</small>
    </label>
    <button class="btn btn-primary" type="submit">Log emergency</button>
  </form>
</div>

<div class="card">
  <h2>Emergency events</h2>
  <table class="data-table" id="emergency-table">
    <thead><tr><th>Ref</th><th>Title</th><th>Site</th><th>Location details</th><th>Severity</th><th>Status</th><th>Site safe</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script src="/static/js/emergency.js"></script>
{% endblock %}
