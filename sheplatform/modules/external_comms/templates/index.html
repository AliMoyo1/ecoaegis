{% extends "base_shell.html" %}
{% block title %}External Communications - EcoAegis{% endblock %}
{% block content %}
<h1>External Communications (SHE EC&amp;SC)</h1>

<div class="card">
  <h2>Draft communication</h2>
  <form id="comms-form">
    <label>Concern description <textarea name="concern_description" rows="2" required></textarea></label>
    <label>Target segment <input type="text" name="target_segment"></label>
    <label>Communication brief <textarea name="communication_brief" rows="2"></textarea></label>
    <label>Medium
      <select name="medium">
        <option value="digital">Digital</option>
        <option value="email">Email</option>
        <option value="workshop">Workshop</option>
        <option value="face_to_face">Face to face</option>
        <option value="letter">Letter</option>
      </select>
    </label>
    <button class="btn btn-primary" type="submit">Save draft</button>
  </form>
</div>

<div class="card">
  <h2>Communications</h2>
  <table class="data-table" id="comms-table">
    <thead><tr><th>Ref</th><th>Concern</th><th>Segment</th><th>Medium</th><th>Status</th><th>HOD approved</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script src="/static/js/comms.js"></script>
{% endblock %}
