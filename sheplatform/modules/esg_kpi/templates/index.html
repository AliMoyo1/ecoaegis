{% extends "base_shell.html" %}
{% block title %}ESG KPIs - EcoAegis{% endblock %}
{% block content %}
<h1>ESG KPI Tracking</h1>

<div class="card">
  <h2>Record KPI entry</h2>
  <form id="esg-form">
    <label>KPI
      <select name="kpi_id" id="kpi-select"></select>
    </label>
    <label>Period (YYYY-MM or YYYY-QN) <input type="text" name="period" placeholder="2026-08" required></label>
    <label>Actual value <input type="number" step="any" name="actual_value" required></label>
    <label>Target value (optional) <input type="number" step="any" name="target_value"></label>
    <label>Notes <input type="text" name="notes"></label>
    <button class="btn btn-primary" type="submit">Record entry</button>
  </form>
</div>

<div class="card">
  <h2>RAG summary</h2>
  <div class="kpi-grid" id="rag-summary"></div>
</div>

<div class="card">
  <h2>KPI definitions</h2>
  <table class="data-table" id="kpi-table">
    <thead><tr><th>Code</th><th>Name</th><th>Category</th><th>Unit</th><th>Threshold</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script src="/static/js/esg.js"></script>
{% endblock %}
